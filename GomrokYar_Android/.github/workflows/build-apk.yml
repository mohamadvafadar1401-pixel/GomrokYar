name: Build GomrokYar APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, feature/original-v6-export-description-search, fix/original-v6-output-compression, test/offline-ocr-latest-original-v6 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download offline Persian OCR model
        run: |
          mkdir -p GomrokYar_Android/app/src/main/assets/tessdata
          curl -L --fail --retry 3 https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/fas.traineddata -o GomrokYar_Android/app/src/main/assets/tessdata/fas.traineddata

      - name: Build debug APK
        working-directory: GomrokYar_Android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GomrokYar-debug-APK
          path: GomrokYar_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
