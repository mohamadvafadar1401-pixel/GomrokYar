name: Build GomrokYar APK

on:
  push:
    branches: [ main, master, stable/v74-login-baseline, feature/v112-redo-features-no-auth, fix/v113-restore-registration-button, fix/v114-first-admin-registration ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept licenses and install SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: |
          gradle --no-daemon -p GomrokYar_Android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GomrokYar-APK
          path: GomrokYar_Android/app/build/outputs/apk/debug/app-debug.apk

# Build the isolated v74 login baseline with tested backup transfer support.
