name: Build GomrokYar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract project
        run: unzip -q -o GomrokYar_Android_CloudBuild.zip

      - name: Commit extracted Android source to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GomrokYar_Android
          if ! git diff --cached --quiet; then
            git commit -m "Add extracted GomrokYar Android project [skip ci]"
            git push
          else
            echo "Extracted Android project is already up to date."
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept licenses and install SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: |
          gradle --no-daemon -p GomrokYar_Android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GomrokYar-APK
          path: GomrokYar_Android/app/build/outputs/apk/debug/app-debug.apk
