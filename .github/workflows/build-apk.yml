name: Build GomrokYar APK
# Integrated Original 8 build: shared goods type options and labels.

on:
  push:
    branches: [ main, master, stable/v74-login-baseline, feature/v106-daily-stats-report-drawer, feature/v106-requested-ui-updates, feature/recent-vehicles-only-v106, feature/daily-jalali-partial-plate-search, feature/original-v3-report-daily-transfer, feature/original-v4-plate-history-export, feature/original-v5-branding-colors, feature/release-signing-updates, feature/release-1.0.8-deleted-daily-export, feature/deleted-records-password-delete, feature/account-menu-user-management, feature/image-export-optimization, feature/auto-backup-50-image-compression, feature/holiday-management-app-icon, feature/modern-ui-refresh, feature/modern-ui-refresh-v2, feature/import-manual-weighing-autocalc, feature/original-v6-export-description-search, feature/original-v7-export-description-search, feature/original-v8-integrated-search-backups, feature/blue-glass-dashboard ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node for legacy Android WebView compatibility
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept licenses and install SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare permanent release signing key
        env:
          GOMROKYAR_KEYSTORE_BASE64: ${{ secrets.GOMROKYAR_KEYSTORE_BASE64 }}
        run: |
          test -n "$GOMROKYAR_KEYSTORE_BASE64" || (echo "Missing GOMROKYAR_KEYSTORE_BASE64 repository secret" && exit 1)
          mkdir -p GomrokYar_Android
          echo "$GOMROKYAR_KEYSTORE_BASE64" | base64 --decode > GomrokYar_Android/gomrokyar-release.jks
          test -s GomrokYar_Android/gomrokyar-release.jks

      - name: Diagnose permanent signing credentials
        env:
          GOMROKYAR_KEYSTORE_FILE: ${{ github.workspace }}/GomrokYar_Android/gomrokyar-release.jks
          GOMROKYAR_KEYSTORE_PASSWORD: ${{ secrets.GOMROKYAR_KEYSTORE_PASSWORD }}
          GOMROKYAR_KEY_ALIAS: ${{ secrets.GOMROKYAR_KEY_ALIAS }}
          GOMROKYAR_KEY_PASSWORD: ${{ secrets.GOMROKYAR_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          EXPECTED_SHA256="40beed5b8a66cc60e01e391465c4880cdd1b6fac24ed3c3d50a3449d4f0b396a"
          ACTUAL_SHA256="$(sha256sum "$GOMROKYAR_KEYSTORE_FILE" | awk '{print $1}')"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "DIAGNOSIS: KEYSTORE_FILE_MISMATCH - decoded file is not the verified v3 permanent key."
            exit 21
          fi
          echo "CHECK 1 PASSED: decoded keystore matches the verified v3 key."
          if ! keytool -list -keystore "$GOMROKYAR_KEYSTORE_FILE" -storepass "$GOMROKYAR_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "DIAGNOSIS: KEYSTORE_PASSWORD_MISMATCH - GOMROKYAR_KEYSTORE_PASSWORD does not open this keystore."
            exit 22
          fi
          echo "CHECK 2 PASSED: keystore password is correct."
          if ! keytool -list -keystore "$GOMROKYAR_KEYSTORE_FILE" -storepass "$GOMROKYAR_KEYSTORE_PASSWORD" -alias "$GOMROKYAR_KEY_ALIAS" >/dev/null 2>&1; then
            echo "DIAGNOSIS: KEY_ALIAS_MISMATCH - GOMROKYAR_KEY_ALIAS does not identify a key in this keystore."
            exit 23
          fi
          echo "CHECK 3 PASSED: key alias exists."
          echo "CHECK 4 DEFERRED: the actual Gradle release-signing task will verify the private-key password."

      - name: Prepare JavaScript for Android 7 WebView
        run: |
          node scripts/prepare-android7-webview.cjs

      - name: Validate login JavaScript and required login elements
        run: node scripts/check-login-code.cjs

      - name: Build signed release APK
        env:
          GOMROKYAR_KEYSTORE_FILE: ${{ github.workspace }}/GomrokYar_Android/gomrokyar-release.jks
          GOMROKYAR_KEYSTORE_PASSWORD: ${{ secrets.GOMROKYAR_KEYSTORE_PASSWORD }}
          GOMROKYAR_KEY_ALIAS: ${{ secrets.GOMROKYAR_KEY_ALIAS }}
          GOMROKYAR_KEY_PASSWORD: ${{ secrets.GOMROKYAR_KEYSTORE_PASSWORD }}
        run: |
          test -n "$GOMROKYAR_KEYSTORE_PASSWORD" || (echo "Missing GOMROKYAR_KEYSTORE_PASSWORD repository secret" && exit 1)
          test -n "$GOMROKYAR_KEY_ALIAS" || (echo "Missing GOMROKYAR_KEY_ALIAS repository secret" && exit 1)
          gradle --no-daemon -p GomrokYar_Android assembleRelease

      - name: Enable Android emulator KVM acceleration
        run: |
          set -e
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
              echo "KVM acceleration is available."
            else
              echo "KVM is present but unavailable to this runner; allowing emulator software fallback."
              echo "ANDROID_I_WANT_MY_TCG=yes" >> "$GITHUB_ENV"
            fi
          else
            echo "No /dev/kvm device on this runner; allowing emulator software fallback."
            echo "ANDROID_I_WANT_MY_TCG=yes" >> "$GITHUB_ENV"
          fi
          ls -l /dev/kvm || true

      - name: Launch GomrokYar on Android emulator and capture login screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -e
            adb install -r GomrokYar_Android/app/build/outputs/apk/release/app-release.apk
            adb shell am force-stop ir.gomrokhyar.app || true
            adb shell am start -n ir.gomrokhyar.app/.MainActivity
            for delay in 2 5 10 20 30; do
              sleep $((delay - ${previous_delay:-0}))
              adb shell screencap -p "/sdcard/gomrokyar-login-${delay}s.png"
              adb pull "/sdcard/gomrokyar-login-${delay}s.png" "gomrokyar-login-${delay}s.png"
              previous_delay=$delay
            done
            adb shell screencap -p /sdcard/gomrokyar-login.png
            adb pull /sdcard/gomrokyar-login.png gomrokyar-login-emulator.png
            adb logcat -d -v time > gomrokyar-logcat.txt

      - name: Upload Android emulator login screenshot
        uses: actions/upload-artifact@v4
        with:
          name: GomrokYar-login-emulator-build-${{ github.run_number }}
          path: |
            gomrokyar-login-emulator.png
            gomrokyar-login-2s.png
            gomrokyar-login-5s.png
            gomrokyar-login-10s.png
            gomrokyar-login-20s.png
            gomrokyar-login-30s.png
            gomrokyar-logcat.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish signed APK as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gomrokyar-build-${{ github.run_number }}
          name: GomrokYar APK - Build ${{ github.run_number }}
          files: GomrokYar_Android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true

      - name: Upload signed APK for direct download
        uses: actions/upload-artifact@v4
        with:
          name: GomrokYar-APK-build-${{ github.run_number }}
          path: GomrokYar_Android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

# All future updates must use this same permanent signing key and keep applicationId unchanged.

# Rebuild after completing the full weighbridge-record editor in Original 7.

# Rebuild after narrowing the weighbridge edit form to the two requested crops and fields.
